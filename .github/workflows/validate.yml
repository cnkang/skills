name: Validate skills

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python --version
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py
      - run: python -m pytest -q conventional-commit-batcher/scripts repository-quality-gate-fixer/tests sonarcloud-link-inspector/tests dev-jev/scripts/test_dev_jev.py tests
      - name: Check committed diff whitespace
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$DIFF_BASE^{commit}" 2>/dev/null; then
            git diff --check "$DIFF_BASE" HEAD
          else
            git show --check --oneline HEAD
          fi

  qdrant-contract:
    name: Offline Qdrant plugin contract (v0.1.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cnkang/hermes-plugin-qdrant-memory
          ref: 5babd3e4b4c022aad38a2b6db82cbd5b601f1ef8 # v0.1.0, immutable release
          path: .contract-plugin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt ./.contract-plugin
      - name: Test real plugin parsers and offline boundaries
        env:
          QDRANT_MEMORY_PLUGIN_ROOT: ${{ github.workspace }}/.contract-plugin
        run: python -m pytest -q tests/test_qdrant_plugin_contract.py --junitxml=reports/plugin-contract.xml
      - name: Reject skipped or empty plugin contract
        run: python scripts/check_test_report.py reports/plugin-contract.xml --minimum-tests 25
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: plugin-contract-results
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14

  qdrant-e2e:
    name: Hermes Hub and disposable Qdrant E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cnkang/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078 # tested immutable host baseline
          path: .runtime-host
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cnkang/hermes-plugin-qdrant-memory
          ref: 5babd3e4b4c022aad38a2b6db82cbd5b601f1ef8 # v0.1.0
          path: .runtime-plugin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-runtime-tests.txt ./.runtime-plugin
      - name: Run mandatory Hub and cross-process runtime acceptance
        env:
          HERMES_SKILL_HOST_ROOT: ${{ github.workspace }}/.runtime-host
          QDRANT_MEMORY_PLUGIN_ROOT: ${{ github.workspace }}/.runtime-plugin
          QDRANT_RUNTIME_E2E: '1'
        run: python -m pytest -q tests/test_hermes_skill_paths.py tests/test_qdrant_runtime_e2e.py --junitxml=reports/runtime-e2e.xml
      - name: Reject skipped or empty runtime acceptance
        run: python scripts/check_test_report.py reports/runtime-e2e.xml --minimum-tests 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-e2e-${{ matrix.os }}
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14

  pi-host:
    name: Pi skill host acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/agent-hosts/pi/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install the pinned MIT Pi SDK from the integrity-checked lockfile
        run: npm ci --prefix tests/agent-hosts/pi --ignore-scripts --no-audit --no-fund
      - run: python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
      - name: Run real Pi skill discovery, expansion and read-tool acceptance
        run: npm test --prefix tests/agent-hosts/pi
      - name: Reject skipped or empty Pi acceptance
        run: python scripts/check_test_report.py reports/pi-host.xml --minimum-tests 11
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pi-host-${{ matrix.os }}
          path: reports/pi-host.xml
          if-no-files-found: error
          retention-days: 14

  distribution:
    name: Distribution (${{ matrix.os }}, skills ${{ matrix.cli }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cli: ['1.7.0', latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --version
      - run: npm --version
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/test_distribution.py --cli-version ${{ matrix.cli }}

  qdrant-standalone:
    name: Standalone CLI and MCP acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cnkang/hermes-plugin-qdrant-memory
          ref: 8fd42572738b15a1abcad62aeecd0de9b1877e3a # standalone-capable merged backend
          path: .standalone-plugin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install standalone runtime without Hermes source
        run: python -m pip install -r requirements-dev.txt "./.standalone-plugin[mcp]"
      - name: Run installed CLI and official stdio MCP contracts
        run: python -m pytest -q .standalone-plugin/tests/standalone --junitxml=reports/standalone.xml
      - name: Reject skipped or empty standalone acceptance
        run: python scripts/check_test_report.py reports/standalone.xml --minimum-tests 27
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked Pi CLI
        run: npm ci --prefix tests/agent-hosts/pi --ignore-scripts --no-audit --no-fund
      - name: Install skill and missing backend in a fresh environment
        if: runner.os == 'Linux'
        env:
          QDRANT_SKILL_INSTALL_E2E: '1'
          QDRANT_STANDALONE_ROOT: ${{ github.workspace }}/.standalone-plugin
          QDRANT_SKILLS_SOURCE: https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}/tree/${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m pytest -q tests/test_skill_runtime_install.py --junitxml=reports/skill-runtime-install.xml
      - name: Reject skipped installation acceptance
        if: runner.os == 'Linux'
        run: python scripts/check_test_report.py reports/skill-runtime-install.xml --minimum-tests 1
      - name: Verify Pi CLI discovers standalone MCP tools
        env:
          QDRANT_LOCAL_AGENTS: '1'
          QDRANT_STANDALONE_ROOT: ${{ github.workspace }}/.standalone-plugin
          PI_ACCEPTANCE_CLI: ${{ github.workspace }}/tests/agent-hosts/pi/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js
        run: python -m pytest -q tests/test_local_agent_mcp.py::test_installed_pi_discovers_scoped_mcp --junitxml=reports/pi-mcp.xml
      - name: Reject skipped Pi CLI acceptance
        run: python scripts/check_test_report.py reports/pi-mcp.xml --minimum-tests 1
      - name: Verify cross-client shared scope and private-agent isolation
        env:
          QDRANT_STANDALONE_E2E: '1'
          QDRANT_STANDALONE_ROOT: ${{ github.workspace }}/.standalone-plugin
        run: python -m pytest -q tests/test_shared_memory_mcp.py --junitxml=reports/shared-memory.xml
      - name: Reject skipped shared-memory acceptance
        run: python scripts/check_test_report.py reports/shared-memory.xml --minimum-tests 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: standalone-${{ matrix.os }}
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14

  required-checks:
    name: Required checks
    if: always()
    needs: [packages, distribution, qdrant-contract, qdrant-e2e, pi-host, qdrant-standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {job: data['result'] for job, data in results.items() if data['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required jobs did not succeed: {failed}')
          print('All package, distribution, plugin contract, Hermes E2E, standalone and Pi host jobs passed')
          PY

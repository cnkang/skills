name: Validate skills

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
    inputs:
      qdrant_runtime_probe_version:
        description: Optional exact hash-locked Runtime compatibility probe; the required lane always uses 0.6.2
        required: false
        default: 'none'
        type: choice
        options: ['none', '0.6.0', '0.6.1', '0.6.2']

permissions:
  contents: read

concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python --version
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-ci-${{ matrix.python }}.txt'
      - run: python scripts/validate_skills.py
      - run: python -m pytest -q tests
      - name: Check committed diff whitespace
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$DIFF_BASE^{commit}" 2>/dev/null; then
            git diff --check "$DIFF_BASE" HEAD
          else
            git show --check --oneline HEAD
          fi

  qdrant-contract:
    name: Offline Qdrant Runtime contract (0.2.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cnkang/hermes-plugin-qdrant-memory
          ref: c85d2bce788b117dddd854bb124971f7de8e564c # immutable Runtime 0.2.2 source
          path: .contract-plugin
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-contract-ci.txt'
      - run: 'python -m pip install --only-binary=:all: --no-deps ./.contract-plugin'
      - name: Test real plugin parsers and offline boundaries
        env:
          QDRANT_MEMORY_PLUGIN_ROOT: ${{ github.workspace }}/.contract-plugin
        run: python -m pytest -q tests/test_qdrant_plugin_contract.py --junitxml=reports/plugin-contract.xml
      - name: Reject skipped or empty plugin contract
        run: python scripts/check_test_report.py reports/plugin-contract.xml --minimum-tests 25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: plugin-contract-results
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14

  qdrant-e2e:
    name: Hermes Hub and disposable Qdrant E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cnkang/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078 # tested immutable host baseline
          path: .runtime-host
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cnkang/hermes-plugin-qdrant-memory
          ref: c85d2bce788b117dddd854bb124971f7de8e564c # Runtime 0.2.2
          path: .runtime-plugin
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-runtime-ci.txt'
      - run: 'python -m pip install --only-binary=:all: --no-deps ./.runtime-plugin'
      # Runtime 0.2.2 predates the lifecycle recovery contract. That P0 scenario
      # runs against the current published Runtime in qdrant-current-runtime-e2e.
      - name: Run mandatory Hub and cross-process compatibility acceptance
        env:
          HERMES_SKILL_HOST_ROOT: ${{ github.workspace }}/.runtime-host
          QDRANT_MEMORY_PLUGIN_ROOT: ${{ github.workspace }}/.runtime-plugin
          QDRANT_RUNTIME_E2E: '1'
        run: python -m pytest -q tests/test_hermes_skill_paths.py tests/test_qdrant_runtime_e2e.py -k 'not writer_busy_callbacks_fail_safely_then_same_instance_recovers' --junitxml=reports/runtime-e2e.xml
      - name: Reject skipped or empty runtime acceptance
        run: python scripts/check_test_report.py reports/runtime-e2e.xml --minimum-tests 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: runtime-e2e-${{ matrix.os }}
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14

  qdrant-current-runtime-e2e:
    name: Hermes Hub and disposable Qdrant E2E (Runtime 0.6.2, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cnkang/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078 # tested immutable host baseline
          path: .runtime-host
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install Runtime compatibility test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r .github/requirements-current-runtime-ci.txt
      - name: Install current hash-locked Runtime wheel
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r ".github/runtime-wheel-locks/requirements-runtime-qdrant-memory-0.6.2.txt"
          python -m pip check
      - name: Resolve installed Runtime plugin package
        env:
          QDRANT_RUNTIME_VERSION: '0.6.2'
        shell: python
        run: |
          import importlib.metadata
          import os
          from pathlib import Path

          import qdrant_memory

          expected = os.environ["QDRANT_RUNTIME_VERSION"]
          actual = importlib.metadata.version("hermes-plugin-qdrant-memory")
          if actual != expected:
              raise SystemExit(f"Expected Runtime {expected}, found {actual}")
          root = Path(qdrant_memory.__file__).resolve().parent
          if not (root / "plugin.yaml").is_file():
              raise SystemExit("Installed Runtime plugin manifest is missing")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write("QDRANT_MEMORY_PLUGIN_ROOT=" + str(root) + "\n")
          print(f"verified_public_runtime={actual}")
      - run: python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
      - name: Run mandatory Hub and cross-process runtime acceptance
        env:
          HERMES_SKILL_HOST_ROOT: ${{ github.workspace }}/.runtime-host
          QDRANT_RUNTIME_E2E: '1'
        run: python -m pytest -q tests/test_hermes_skill_paths.py tests/test_qdrant_runtime_e2e.py --junitxml=reports/current-runtime-e2e.xml
      - name: Reject skipped or empty current-release acceptance
        run: python scripts/check_test_report.py reports/current-runtime-e2e.xml --minimum-tests 6
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: current-runtime-e2e-${{ matrix.os }}
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14

  qdrant-runtime-probe:
    name: Optional Runtime compatibility probe (manual dispatch only)
    if: github.event_name == 'workflow_dispatch' && inputs.qdrant_runtime_probe_version != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cnkang/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078 # tested immutable host baseline
          path: .runtime-host
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install hash-locked Runtime compatibility test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r .github/requirements-current-runtime-ci.txt
      - name: Install selected hash-locked Runtime wheel
        env:
          QDRANT_RUNTIME_VERSION: ${{ inputs.qdrant_runtime_probe_version }}
        shell: bash
        run: |
          case "$QDRANT_RUNTIME_VERSION" in
            0.6.0|0.6.1|0.6.2) ;;
            *) echo "::error::Unsupported Runtime probe; choose a version with a checked-in wheel hash lock"; exit 1 ;;
          esac
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r ".github/runtime-wheel-locks/requirements-runtime-qdrant-memory-${QDRANT_RUNTIME_VERSION}.txt"
          python -m pip check
      - name: Verify selected Runtime package version
        env:
          QDRANT_RUNTIME_VERSION: ${{ inputs.qdrant_runtime_probe_version }}
        run: |
          python -c "import importlib.metadata, os; actual = importlib.metadata.version('hermes-plugin-qdrant-memory'); expected = os.environ['QDRANT_RUNTIME_VERSION']; print(f'verified_probe_runtime={actual}'); raise SystemExit(actual != expected)"
      - run: python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
      - name: Run optional Hub and cross-process compatibility acceptance
        env:
          HERMES_SKILL_HOST_ROOT: ${{ github.workspace }}/.runtime-host
          QDRANT_RUNTIME_E2E: '1'
        run: python -m pytest -q tests/test_hermes_skill_paths.py tests/test_qdrant_runtime_e2e.py --junitxml=reports/runtime-probe.xml
      - name: Reject skipped or empty compatibility probe
        run: python scripts/check_test_report.py reports/runtime-probe.xml --minimum-tests 6
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: runtime-probe-${{ inputs.qdrant_runtime_probe_version }}
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14

  pi-host:
    name: Pi skill host acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/agent-hosts/pi/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install the pinned MIT Pi SDK from the integrity-checked lockfile
        run: npm ci --prefix tests/agent-hosts/pi --ignore-scripts --no-audit --no-fund
      - run: python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
      - name: Run real Pi skill discovery, expansion and read-tool acceptance
        run: npm test --prefix tests/agent-hosts/pi
      - name: Reject skipped or empty Pi acceptance
        run: python scripts/check_test_report.py reports/pi-host.xml --minimum-tests 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pi-host-${{ matrix.os }}
          path: reports/pi-host.xml
          if-no-files-found: error
          retention-days: 14

  distribution:
    name: Distribution (${{ matrix.os }}, skills ${{ matrix.cli }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cli: ['1.7.0', latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: node --version
      - run: npm --version
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-ci-3.14.txt'
      - run: python scripts/test_distribution.py --cli-version ${{ matrix.cli }}

  qdrant-standalone:
    name: Standalone CLI and MCP acceptance (${{ matrix.os }}, SDK ${{ matrix.mcp.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mcp:
          - name: '1.x'
            requirement: 'mcp>=1.30,<2'
          - name: '2.x'
            requirement: 'mcp>=2,<3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cnkang/hermes-plugin-qdrant-memory
          ref: c85d2bce788b117dddd854bb124971f7de8e564c # merged Runtime source
          path: .standalone-plugin
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install pinned standalone runtime dependencies (MCP SDK 1.x)
        if: matrix.mcp.name == '1.x'
        run: 'python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-standalone-mcp1-ci.txt'
      - name: Install pinned standalone runtime dependencies (MCP SDK 2.x)
        if: matrix.mcp.name == '2.x'
        run: 'python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-standalone-mcp2-ci.txt'
      - name: Install standalone runtime without Hermes source
        run: 'python -m pip install --only-binary=:all: --no-deps "./.standalone-plugin[mcp]"'
      - name: Run installed CLI and official stdio MCP contracts
        run: python -m pytest -q .standalone-plugin/tests/standalone --junitxml=reports/standalone.xml
      - name: Reject skipped or empty standalone acceptance
        run: python scripts/check_test_report.py reports/standalone.xml --minimum-tests 27
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install locked Pi CLI
        run: npm ci --prefix tests/agent-hosts/pi --ignore-scripts --no-audit --no-fund
      - name: Install skill and verify the public Runtime default
        env:
          QDRANT_SKILL_INSTALL_E2E: '1'
          QDRANT_SKILL_INSTALL_DEFAULT_VERSION: '0.6.2'
          QDRANT_SKILL_MCP_REQUIREMENT: ${{ matrix.mcp.requirement }}
          QDRANT_SKILL_INSTALL_REVISION: c85d2bce788b117dddd854bb124971f7de8e564c
          QDRANT_STANDALONE_ROOT: ${{ github.workspace }}/.standalone-plugin
          QDRANT_SKILLS_SOURCE: https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}/tree/${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m pytest -q tests/test_skill_runtime_install.py --junitxml=reports/skill-runtime-install.xml
      - name: Reject skipped installation acceptance
        run: python scripts/check_test_report.py reports/skill-runtime-install.xml --minimum-tests 1
      - name: Verify Pi CLI discovers standalone MCP tools
        env:
          QDRANT_LOCAL_AGENTS: '1'
          QDRANT_STANDALONE_ROOT: ${{ github.workspace }}/.standalone-plugin
          PI_ACCEPTANCE_CLI: ${{ github.workspace }}/tests/agent-hosts/pi/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js
        run: python -m pytest -q tests/test_local_agent_mcp.py::test_installed_pi_discovers_scoped_mcp --junitxml=reports/pi-mcp.xml
      - name: Reject skipped Pi CLI acceptance
        run: python scripts/check_test_report.py reports/pi-mcp.xml --minimum-tests 1
      - name: Verify cross-client shared scope and private-agent isolation
        env:
          QDRANT_STANDALONE_E2E: '1'
          QDRANT_STANDALONE_ROOT: ${{ github.workspace }}/.standalone-plugin
        run: python -m pytest -q tests/test_shared_memory_mcp.py --junitxml=reports/shared-memory.xml
      - name: Reject skipped shared-memory acceptance
        run: python scripts/check_test_report.py reports/shared-memory.xml --minimum-tests 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: standalone-${{ matrix.os }}-mcp-${{ matrix.mcp.name }}
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14

  workflow-security:
    name: Workflow security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install verified actionlint 1.7.12
        env:
          ACTIONLINT_ARCHIVE: ${{ runner.temp }}/actionlint.tar.gz
        run: |
          curl --fail --silent --show-error --location --proto "=https" --proto-redir "=https" --output "$ACTIONLINT_ARCHIVE" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $ACTIONLINT_ARCHIVE" | sha256sum --check
          tar -xzf "$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflow syntax, expressions and shell steps
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Audit workflow security with zizmor 1.32.0
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          online-audits: false
          version: 1.32.0
          persona: regular

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified gitleaks 8.30.1
        env:
          GITLEAKS_ARCHIVE: ${{ runner.temp }}/gitleaks.tar.gz
        run: |
          curl --fail --silent --show-error --location --proto "=https" --proto-redir "=https" --output "$GITLEAKS_ARCHIVE" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $GITLEAKS_ARCHIVE" | sha256sum --check
          tar -xzf "$GITLEAKS_ARCHIVE" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the commits introduced by this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          base="${BASE_SHA:-}"
          case "$base" in
            "" | 0000000000000000000000000000000000000000) base="" ;;
          esac
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi
          if [ -z "$base" ] && git rev-parse --verify --quiet origin/main >/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || true)
          fi
          if [ -n "$base" ] && [ "$base" != "$HEAD_SHA" ]; then
            scan_range="$base..$HEAD_SHA"
          else
            # No usable base: every commit reachable from the tip is new here.
            scan_range="$HEAD_SHA"
          fi
          # A merge commit has no patch by default. Compare it with its first
          # parent so conflict resolutions and octopus-merge additions are
          # scanned. `remerge` would skip octopus merges entirely.
          scan_range="$scan_range --diff-merges=first-parent"
          echo "Scanning $scan_range"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="$scan_range" .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
      - name: Install verified OSV-Scanner 2.7.0
        env:
          OSV_BINARY: ${{ runner.temp }}/osv-scanner
        run: |
          curl --fail --silent --show-error --location --proto "=https" --proto-redir "=https" --output "$OSV_BINARY" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $OSV_BINARY" | sha256sum --check
          chmod +x "$OSV_BINARY"
      - name: Scan the hash-pinned CI locks that dependency review cannot see
        env:
          OSV_BINARY: ${{ runner.temp }}/osv-scanner
        run: |
          set -eu
          args=()
          for lock in .github/requirements-*.txt .github/runtime-wheel-locks/*.txt; do
            args+=(--lockfile="$lock")
          done
          test "${#args[@]}" -gt 0
          "$OSV_BINARY" scan source "${args[@]}"

  sonarcloud:
    name: SonarCloud quality gate
    # Fork and Dependabot pull requests never receive the token.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN" || { echo '::error::Configure the SONAR_TOKEN repository secret.'; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # The hash lock is built for 3.14; the runner default is not.
          python-version: '3.14'
      - name: Measure coverage for the quality gate
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-sonar-ci.txt
          python -m pytest -q tests --cov --cov-report=xml
      - name: Analyze and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scanner host lives in the workflow, not in a data file, so a
          # pull request cannot redirect the token by editing a properties file.
          SONAR_HOST_URL: https://sonarcloud.io

  required-checks:
    name: Required checks
    if: always()
    needs:
      - packages
      - distribution
      - qdrant-contract
      - qdrant-e2e
      - qdrant-current-runtime-e2e
      - pi-host
      - qdrant-standalone
      - workflow-security
      - secret-scan
      - dependency-review
      - sonarcloud
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every test job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          DEPENDABOT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: python3 scripts/check_required_checks.py
      - name: Record why each job ended the way it did
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## Job outcomes"
            echo ""
            echo "Columns: job, conclusion, runner, executed steps."
            echo "An empty runner with zero steps means the job never started."
            echo ""
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | [.name, (.conclusion // .status), (.runner_name // "-"), ((.steps // []) | length)] | @tsv' || true
          } >> "$GITHUB_STEP_SUMMARY"

name: WorkBuddy preview

on:
  pull_request:
  push:
    branches: ['codex/**']
  workflow_dispatch:
    inputs:
      skill:
        description: 'Build one catalog skill only (empty builds all catalog skills)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: workbuddy-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py
      - run: python -m pytest -q tests/test_workbuddy_package.py tests/test_workbuddy_release.py
      - run: python integrations/workbuddy/build.py --check
      - name: Build packages
        env:
          SKILL_INPUT: ${{ inputs.skill }}
        run: |
          if [ -z "$SKILL_INPUT" ]; then
            python integrations/workbuddy/build.py
          else
            python integrations/workbuddy/build.py --skill "$SKILL_INPUT"
          fi
      - name: Verify checksum
        working-directory: dist/workbuddy
        run: sha256sum --check ./*-preview.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: skills-workbuddy-preview
          path: |
            dist/workbuddy/*-preview.zip
            dist/workbuddy/*-preview.zip.sha256
          if-no-files-found: error
          retention-days: 14

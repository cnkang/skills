name: WorkBuddy preview

on:
  pull_request:
  push:
    branches: ['codex/**']
  workflow_dispatch:
    inputs:
      skill:
        description: 'Build one catalog skill only (empty builds all catalog skills)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: workbuddy-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py
      - run: python -m pytest -q tests/test_workbuddy_package.py tests/test_workbuddy_release.py
      - run: python integrations/workbuddy/build.py --check
      - name: Build packages
        env:
          SKILL_INPUT: ${{ inputs.skill }}
        run: |
          if [ -z "$SKILL_INPUT" ]; then
            python integrations/workbuddy/build.py
          else
            python integrations/workbuddy/build.py --skill "$SKILL_INPUT"
          fi
      - name: Verify checksum
        working-directory: dist/workbuddy
        run: sha256sum --check ./*-preview.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skills-workbuddy-preview
          path: |
            dist/workbuddy/*-preview.zip
            dist/workbuddy/*-preview.zip.sha256
          if-no-files-found: error
          retention-days: 14

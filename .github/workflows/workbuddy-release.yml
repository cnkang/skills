name: WorkBuddy draft release assets

on:
  push:
    tags: ['skills-*']

permissions:
  contents: read

concurrency:
  group: workbuddy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag ancestry before running repository code
        env:
          SNAPSHOT_TAG: ${{ github.ref_name }}
        run: |
          [[ "$SNAPSHOT_TAG" =~ ^skills-[0-9]{8}\.[1-9][0-9]*$ ]]
          test "$(git cat-file -t "refs/tags/$SNAPSHOT_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$SNAPSHOT_TAG^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py
      - run: python -m pytest -q tests/test_workbuddy_package.py tests/test_workbuddy_release.py
      - name: Validate exact release source and build
        env:
          SNAPSHOT_TAG: ${{ github.ref_name }}
        run: |
          python integrations/workbuddy/release.py --snapshot-tag "$SNAPSHOT_TAG" --check-source
          python integrations/workbuddy/build.py --snapshot-tag "$SNAPSHOT_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workbuddy-${{ github.ref_name }}
          path: dist/workbuddy/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate tag ancestry before running repository code
        env:
          SNAPSHOT_TAG: ${{ github.ref_name }}
        run: |
          [[ "$SNAPSHOT_TAG" =~ ^skills-[0-9]{8}\.[1-9][0-9]*$ ]]
          test "$(git cat-file -t "refs/tags/$SNAPSHOT_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$SNAPSHOT_TAG^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: workbuddy-${{ github.ref_name }}
          path: dist/workbuddy
      - name: Rebuild, compare and attach before publication
        env:
          SNAPSHOT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python integrations/workbuddy/release.py --snapshot-tag "$SNAPSHOT_TAG"

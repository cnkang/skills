name: WorkBuddy draft release assets

on:
  push:
    tags: ['skills-*']

permissions:
  contents: read

concurrency:
  group: workbuddy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag ancestry before running repository code
        env:
          SNAPSHOT_TAG: ${{ github.ref_name }}
        run: |
          [[ "$SNAPSHOT_TAG" =~ ^skills-[0-9]{8}\.[1-9][0-9]*$ ]]
          test "$(git cat-file -t "refs/tags/$SNAPSHOT_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$SNAPSHOT_TAG^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py
      - run: python -m pytest -q tests/test_workbuddy_package.py tests/test_workbuddy_release.py
      - name: Validate exact release source and build
        env:
          SNAPSHOT_TAG: ${{ github.ref_name }}
        run: |
          python integrations/workbuddy/release.py --snapshot-tag "$SNAPSHOT_TAG" --check-source
          python integrations/workbuddy/build.py --snapshot-tag "$SNAPSHOT_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbuddy-${{ github.ref_name }}
          path: dist/workbuddy/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate tag ancestry before running repository code
        env:
          SNAPSHOT_TAG: ${{ github.ref_name }}
        run: |
          [[ "$SNAPSHOT_TAG" =~ ^skills-[0-9]{8}\.[1-9][0-9]*$ ]]
          test "$(git cat-file -t "refs/tags/$SNAPSHOT_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$SNAPSHOT_TAG^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workbuddy-${{ github.ref_name }}
          path: dist/workbuddy
      - name: Rebuild, compare and attach before publication
        env:
          SNAPSHOT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python integrations/workbuddy/release.py --snapshot-tag "$SNAPSHOT_TAG"
